name: Issue 8205 exact production head validation

on:
  push:
    branches: [ci/8205-production-route]
  workflow_dispatch:

concurrency:
  group: issue-8205-production-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-and-wsl2-reference:
    if: github.repository == 'Dante-dan/cc-switch'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 554570626eebe3dae4009ca9009c663dd4184af4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.95'
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364
        with:
          distribution: Ubuntu-22.04
          wsl-version: 2
          additional-packages: python3
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          shared-key: backend
      - name: Prepare isolated native test directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $testHome = Join-Path $env:RUNNER_TEMP 'ccswitch8205-home'
          New-Item -ItemType Directory -Force -Path $testHome | Out-Null
          "CC_SWITCH_TEST_HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_DISTRO=Ubuntu-22.04" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git rev-parse HEAD
          wsl.exe --list --verbose
          wsl.exe -d Ubuntu-22.04 --exec python3 -c "import sqlite3,sys; print(sys.version); print(sqlite3.sqlite_version)"
      - name: Native Windows readonly WAL reference
        shell: pwsh
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml readonly_reader_sees_committed_wal_without_immutable -- --nocapture
      - name: Windows-to-WSL2 live WAL production scan messages and content
        shell: pwsh
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml wsl2_live_wal_readonly_reference -- --ignored --nocapture

      - name: WSL routing path boundary tests
        shell: pwsh
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml session_manager::hermes_wsl::tests -- --nocapture
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: Native Windows full backend suite
        working-directory: src-tauri
        run: cargo test
  renderer-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 554570626eebe3dae4009ca9009c663dd4184af4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:unit
      - run: pnpm build:renderer
